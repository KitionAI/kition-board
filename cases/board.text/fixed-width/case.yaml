format: 1
id: board.text/fixed-width
feature: board.text
intent: >-
  A text with a stored size wraps at its width and its box is the stored height or its lines'
  height, whichever is taller; a text without one is one line per paragraph; a connector bound to a
  fixed-width text follows its box as a longer text makes it taller (stored point and derived point
  alike).
layer: gate
dimension: function
