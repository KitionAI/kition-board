feature: board.editor.connect
intent: >-
  The line drawn while a connector is dragged is the engine's own connector (connector.getRoute):
  it has its arrowhead, the target shape is outlined, and its route is the route the release
  commits. A connector drawn from a selected shape's handle takes the drawing style's route
  (straight by default). Before, the preview was a plain line from the press point without an
  arrowhead, and a handle always drew an elbow.
