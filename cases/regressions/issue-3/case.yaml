id: regressions/issue-3
feature: board.drawing
intent: >-
  A line shape runs along its box's longer side through its middle, so a tall box draws a
  vertical line as a wide box draws a horizontal one; a freehand stroke takes dashStyle (solid,
  dashed, dotted) in stroke.add and element.set, and draws its dashes. Before, a line shape
  was always horizontal and stroke.add refused a dash style.
