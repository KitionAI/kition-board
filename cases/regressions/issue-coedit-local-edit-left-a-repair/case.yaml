id: regressions/issue-coedit-local-edit-left-a-repair
feature: board.collab.live
intent: >-
  A command never leaves a state the repair (rules V1 to V9) would change: moving a group's last
  members into a frame removes the emptied group in the same undo step, so the replica that made
  the edit agrees with every other replica and with its own copy reopened after a crash.
layer: unit
dimension: collab
