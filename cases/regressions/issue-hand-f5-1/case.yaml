feature: board.editor.text-box
intent: >-
  While a long label of a shape is edited, the text box is the shape's box: the whole label is
  visible (the box is as tall as its lines and never scrolls), it wraps at the engine's label width
  where the engine's fragment wraps, more typing grows it downward without growing the shape, the
  lines after the commit break where they broke in the box, and the shape's own text is hidden while
  the box shows it. Before, the box was two lines high and the label scrolled inside it, so only the
  last two lines showed.
