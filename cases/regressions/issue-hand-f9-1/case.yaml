id: regressions/issue-hand-f9-1
feature: board.editor.containers
intent: >-
  A frame is moved by its title (which shows the move cursor and outlines the frame) and its line,
  taking what it holds along; a drag on its empty inside is a marquee that selects the shapes it
  touches and leaves the frame where it is, and a marquee selects a frame only when it encloses
  the whole frame. Before, an untitled frame had no title to take hold of, and a marquee touching
  a frame selected it.
