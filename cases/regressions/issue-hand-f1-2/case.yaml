format: 1
id: regressions/issue-hand-f1-2
feature: board.editor.focus
intent: >-
  Right after the board opens, with nothing clicked, R picks the shape tool. Before, the focus
  stayed outside the editor (document.activeElement was the body, and in the development host the
  top page held it), so the first tool letter did nothing until the person clicked the canvas. The
  canvas now takes the keys when the board opens, and the frame's keyboardHome hands it any key
  pressed while nothing holds the keyboard.
