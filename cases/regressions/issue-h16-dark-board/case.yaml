format: 1
id: regressions/issue-h16-dark-board
feature: board.platform.color-scheme
intent: >-
  In Kition's dark scheme the board's minimap is drawn on the dark paper with the colour tokens'
  dark colours (`renderScheme`), the default ink light enough to read, a file's own `#rrggbb`
  colours kept, and every element in the same pixels as in the light scheme; the contract's
  `render`, `file.render` and `file.export` stay light and byte for byte what they were, and
  asking for the dark minimap moves neither the revision nor the saved state. Before, the board
  had one light palette: in a dark host the whole endless canvas and its minimap were white
  (Kition's host matrix row H16: median luminance 1.000).
