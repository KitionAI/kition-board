format: 1
id: regressions/issue-headless-shipped-fonts
feature: board.agent.preview
intent: >-
  `kition-board` draws text with the fonts the kit ships (KHP A39) with no environment variable:
  Inter and Droid Sans Fallback, the faces the editor gives the engine, are built into the
  executable from the kition-fonts checkout the web build copies them from. Before, it read them
  only from `KITION_FONTS_DIR` at run time, so a kits server that did not set it got previews and
  exports with no text.
layer: gate
source:
  kind: probe
  from: "agent readiness review (previews without KITION_FONTS_DIR have no text)"
  license: owned
input: []
steps:
  - cargo-test: { package: kition-board, test: fonts }
expected:
  - actual: out:cargo-test
    compare: exit
    value: 0
since: "2026-11-17"
