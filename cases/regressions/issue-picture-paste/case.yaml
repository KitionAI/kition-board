format: 1
id: regressions/issue-picture-paste
feature: board.images
intent: >-
  A picture copied on one board and pasted on another: the clipboard payload names a picture by its
  blob's hash, not its bytes, and the editor pastes a payload into another document (the system
  clipboard's `kition-board:` text). edit.paste leaves out a picture whose bytes the destination
  does not store, names it in its answer (`skipped`, reason `board.image-missing-blob`) and pastes
  the rest where it would have landed; a payload of nothing but such pictures is refused, and a
  board that stores the bytes pastes the picture. The editor tells the person either way. Before,
  the paste made an image element naming a blob the board does not have: a broken picture that
  board_check reported as board.image-missing-blob. Found by the review of c7a161c..b540d9d.
layer: gate
source: {kind: synthetic, from: bindings/wasm/tests/picture_paste.rs, license: Apache-2.0}
input: []
steps:
  - cargo-test: {package: kition-board-kit, test: picture_paste}
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-22"
