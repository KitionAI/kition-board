format: 1
id: board.editor.gestures/threshold-escape
feature: board.editor.gestures
intent: >-
  A press on a shape stays a press until the pointer has moved 4 screen pixels (released before,
  nothing moves and no command runs); past them it is a drag. Escape during a drag puts the shape
  back where it was, ends the gesture and lets the pointer go, so the release that follows changes
  nothing; Escape during a marquee keeps the selection from before it (rules 1 and 6 of the by-
  hand plan).
