      cmd: [node, web/tests/pages.mjs, chromium]
  - exec:
      cmd: [node, web/tests/pages.mjs, webkit]
expected:
  - { actual: "out:exec", compare: exit, value: 0 }
since: "2026-11-19"
timeout_s: 300
requires: [chromium, webkit]
