format: 1
id: board.platform.document-identity/fork
feature: board.platform.document-identity
intent: >-
  Through the real kition-board process: document.identity answers the docId a .kboard carries
  (the one meta.json's copy names), and a byte copy answers the same one; document.fork writes a
  new document to a new file: a new docId in the replica and in meta.json, the same objects, ids
  and values, sealed content with no history, the kit, blobs and unknown entries as they were; the
  text of a shape deleted before the save is in neither file; an edited fork's file holds its
  content, not its whole history, and becomes a birth only through rebirth; a fork of the fork is a
  third document; a fork never replaces an existing file.
layer: gate
