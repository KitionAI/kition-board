  from: bindings/wasm/tests/nothing_to_repair.rs (the random edits of the deleted convergence suite)
  license: owned
input: []
steps:
  - cargo-test: { package: kition-board-kit, test: nothing_to_repair }
expected:
  - actual: out:exit
    compare: exit
