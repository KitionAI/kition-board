format: 1
id: board.collab.live/converges
feature: board.collab.live
intent: >-
  Two to five replicas of a board, edited at once through the engine's own commands (shapes,
  text, connectors bound to elements, frames and drops into them, cards, pictures, groups,
  z-order), offline and then merged in any order, end equal, keep their references, and draw what
  a fresh replica draws (kition-sdk's platform convergence suite, L6, 17 of 17 scenarios). The
  board's own scenarios run on every replica count from 2 to 5: concurrent moves of one shape end
  on one person's move with a concurrent resize kept; a connector bound to a shape another person
  deletes lets go of it where it last was; a shape dropped into two frames at once ends in one,
  drawn inside it and in front of it; a frame deleted while someone drops into it keeps what was
  dropped; frames put inside each other at once make no cycle; emptied groups go; a card keeps one
  person's whole target; z-order keeps every element once; a label typed by everyone keeps every
  word; replicas offline for 40 edits each agree once merged.
layer: gate
dimension: collab
source:
  kind: synthetic
  from: bindings/wasm/tests/convergence.rs
  license: owned
input: []
steps:
  - cargo-test: { package: kition-board-kit, test: convergence }
expected:
  - { actual: "out:steps", compare: exit, value: 0 }
since: "2026-11-17"
timeout_s: 300
