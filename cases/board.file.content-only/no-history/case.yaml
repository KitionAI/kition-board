format: 1
id: board.file.content-only/no-history
feature: board.file.content-only
intent: >-
  A board whose change log holds typed-then-deleted text, a deleted element and an overwritten
  value saves to a .kboard whose content entry (content.json) holds the state, no version, lineage
  or origin, and none of those strings, each found in the session's change log first; an unchanged
  board saves to the same bytes, twice, after markSaved and from the file opened again, which holds
  the same objects under the same ids; through the headless kit, an agent's batches save files
  holding no history and answer what they changed.
layer: gate
source:
  kind: synthetic
  from: bindings/wasm/tests/content_file.rs (an_unchanged_board_saves_to_the_same_bytes_and_its_content_holds_no_history), bindings/headless/tests/content_file.rs
  license: Apache-2.0
input: []
steps:
  - cargo-test: { package: kition-board-kit, test: content_file, filter: an_unchanged_board_saves_to_the_same_bytes }
  - cargo-test: { package: kition-board, test: content_file }
expected:
  - actual: out:cargo-test
    compare: exit
    value: 0
since: "2026-11-22"
