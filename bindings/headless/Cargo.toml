[package]
name = "kition-board"
description = "The Board kit for Kition's agent: the Kition SDK document served headless over the Kit Protocol."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
kition-board-kit = { path = "../wasm" }
kition-headless = { workspace = true }

[dev-dependencies]
# The headless tests drive the kit as a host does (KitBackend) and read what it answers.
kition-kit-server = { workspace = true }
kition-kit = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { workspace = true }
# The agent's tools end to end (tests/premise.rs): kition-kits runs this executable.
kition-kits = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
