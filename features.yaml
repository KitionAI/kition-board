  - id: board.agent.guard
    title: Independent file writers preserve per-call premises
    dimension: [ai, collab, data-safety]
    priority: P0
    status: partial
    paths: [crates/engine/model/src/premises.rs, crates/engine/model/src/acts.rs, crates/kdm/kdm-model/model/schema.json, bindings/headless/tests/outside.rs, bindings/headless/tests/mixed.rs, bindings/headless/tests/land12.rs, bindings/headless/tests/gaps12.rs, bindings/headless/tests/matrix3.rs, bindings/wasm/tests/declarations_independent.rs, bindings/headless/tests/independent.rs, bindings/wasm/tests/undo_premises.rs, bindings/wasm/src/lib.rs, bindings/wasm/tests/reread.rs, bindings/wasm/tests/outline_premises.rs]
    gap: "Measured on kition-sdk 2ce294a1 (the kit pins f5ea478): the SDK permits stale numeric/implicit page destinations and deleted page gaps; raw z-index writes and deletion coverage hold (their waiting_for_sdk tests pass). Scoped hierarchy facts and z-order windows give false refusals; removed/moved derived dependencies can report changed instead of deleted/relocated. waiting_for_sdk tests keep their necessity expectations. Undo and redo hold the objects and fields of the step they take back or put back. All 83 independent reading rows run on flat and nested boards. A bound end on a shape meets its outline, so a connector's route and an anchored connector.add end hold the shape's shapeType (regressions/issue-outline-end-premises); connector.bind without an anchor also reads the other end's target shapeType (the new end faces that end's outline point) and does not hold it: the two connector.bind rows of bindings/wasm/tests/declarations_independent.rs (every_write_rests_on_what_its_handler_reads, nested_write_rows_match_the_second_independent_reading) pin that target's premise as rotation and ~bounds, and changing them needs a maintainer."
    cases: [board.agent.guard/outside-tables, regressions/issue-c8-board-pin-reread, regressions/issue-c8-board-index-gap, regressions/issue-c8-board-map-premises, regressions/issue-c8-board-page-copy, regressions/issue-c8-board-land12, regressions/issue-c8-board-deleted-gap12, regressions/issue-c8-board-read, regressions/issue-c8-board-read-writers, regressions/issue-c8-board-3-address, regressions/issue-c8-board-3-derived, regressions/issue-c8-board-3-nested, regressions/issue-c8-board-3-ungroup-lock, regressions/issue-c8-board-3-dependencies, regressions/issue-c8-board-3-named, regressions/issue-c8-board-undo-premises, regressions/issue-outline-end-premises]
    since: "2026-11-17"
