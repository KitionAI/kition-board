  - id: board.collab.live
    title: People co-edit a board live (shapes, text, connectors, frames, cards, groups, z-order) and converge
    dimension: [collab, data-safety]
    priority: P1
    status: partial
    paths: [crates/engine/model/src/lib.rs, crates/kdm/kdm-model/src/validate.rs, bindings/wasm/tests/convergence.rs, web/src/board/sync.ts, web/src/canvas/BoardCanvas.tsx]
    gap: >-
      The engine side is done: every edit is a KDM change with stable ids, imports repair
      deterministically, and the convergence suite and the board's own scenarios pass on 2 to 5
      replicas. Not yet: presence (the editor does not list `presence`, so cursors and selections
      are not shared or drawn), a gesture or text box over an element another person deletes is
      not cancelled before its commit fails, and there is no two-editor browser check (no
      workspace host in web/tests).
    cases: [board.collab.live/converges, regressions/issue-coedit-local-edit-left-a-repair]
    since: "2026-11-17"
