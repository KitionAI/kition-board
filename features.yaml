    dimension: [collab, data-safety]
    priority: P1
    status: partial
    paths: [crates/engine/model/src/lib.rs, crates/kdm/kdm-model/src/validate.rs, crates/kdm/kdm-model/tests/repair.rs, bindings/wasm/tests/nothing_to_repair.rs, bindings/wasm/tests/batch_repair.rs, web/src/board/sync.ts, web/src/canvas/BoardCanvas.tsx]
    gap: >-
      Kition Desktop is for one person since the plain document model (kition-sdk 91cf510, plan
      2026-11-24): the KDM no longer merges concurrent edits, so the convergence suite and the
      board's merge scenarios are gone; co-editing comes back with Kition One's server-ordered
